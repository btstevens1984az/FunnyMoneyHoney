services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DEMO_MODE: "${DEMO_MODE:-true}"
      ODDS_API_KEY: "${ODDS_API_KEY:-}"
      DATABASE_URL: "sqlite:////data/funnymoneyhoney.db"
      CORS_ORIGINS: "http://localhost:5173,http://localhost:3000,http://localhost:8000,http://127.0.0.1:5173"
    volumes:
      - fmh_data:/data
    restart: unless-stopped

  web:
    image: node:22-alpine
    working_dir: /frontend
    volumes:
      - ./frontend:/frontend
      - web_node_modules:/frontend/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - api
    restart: unless-stopped

volumes:
  fmh_data:
  web_node_modules:
