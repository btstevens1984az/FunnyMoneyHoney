<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <rect width="1200" height="675" fill="#070b12"/>
  <text x="80" y="90" font-family="Sora,sans-serif" font-size="36" font-weight="700" fill="#fff">$1000 daily bankroll simulator</text>
  <text x="80" y="130" font-family="IBM Plex Sans,sans-serif" font-size="18" fill="#94a3b8">Monte Carlo teaching tool  not a profit forecast</text>
  <rect x="80" y="180" width="240" height="90" rx="16" fill="#121a2b" stroke="rgba(255,255,255,0.08)"/>
  <text x="100" y="215" font-family="IBM Plex Sans,sans-serif" font-size="12" fill="#64748b">EXPECTED P&amp;L</text>
  <text x="100" y="250" font-family="IBM Plex Mono,monospace" font-size="28" fill="#e8b84b">$1,240</text>
  <rect x="340" y="180" width="240" height="90" rx="16" fill="#121a2b" stroke="rgba(255,255,255,0.08)"/>
  <text x="360" y="215" font-family="IBM Plex Sans,sans-serif" font-size="12" fill="#64748b">5TH %ILE</text>
  <text x="360" y="250" font-family="IBM Plex Mono,monospace" font-size="28" fill="#fb7185">-$4,800</text>
  <rect x="600" y="180" width="240" height="90" rx="16" fill="#121a2b" stroke="rgba(255,255,255,0.08)"/>
  <text x="620" y="215" font-family="IBM Plex Sans,sans-serif" font-size="12" fill="#64748b">95TH %ILE</text>
  <text x="620" y="250" font-family="IBM Plex Mono,monospace" font-size="28" fill="#2dd4bf">$8,100</text>
  <polyline points="100,520 220,480 340,500 460,430 580,450 700,380 820,400 940,340 1060,360"
            fill="none" stroke="#e8b84b" stroke-width="4"/>
  <text x="80" y="600" font-family="IBM Plex Sans,sans-serif" font-size="16" fill="#64748b">Past or simulated results do not predict future outcomes.</text>
</svg>
